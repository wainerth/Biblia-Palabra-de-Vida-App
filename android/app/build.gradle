plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    dexOptions {
        javaMaxHeapSize "1g"
        preDexLibraries false
    }
    
    namespace = "com.example.biblia_palabra_de_vida_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // // Configuración para diferentes ambientes
    // flavorDimensions "environment"
    // productFlavors {
    //     dev {
    //         dimension "environment"
    //         applicationId "com.example.biblia_palabra_de_vida_app.dev"
    //         versionNameSuffix "-DEV"
    //         resValue "string", "app_name", "Biblia Dev"
    //     }
    //     prod {
    //         dimension "environment"
    //         applicationId "com.example.biblia_palabra_de_vida_app"
    //         resValue "string", "app_name", "Biblia Palabra de Vida"
    //     }
    // }

    defaultConfig {
        multiDexEnabled true
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {
            keyAlias "androiddebugkey"
            keyPassword "123456"
            storeFile file("myKey.jks")
            storePassword "123456"
        }
        release {
            keyAlias "androiddebugkey"
            keyPassword "123456"
            storeFile file("myKey.jks")
            storePassword "123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // // Configuración para nombres de archivos de salida
    // applicationVariants.all { variant ->
    //     variant.outputs.all { output ->
    //         def flavor = variant.flavorName
    //         def versionName = variant.versionName
    //         def buildType = variant.buildType.name
    //         output.outputFileName = "biblia_${flavor}_${buildType}_${versionName}.apk"
    //     }
    // }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}