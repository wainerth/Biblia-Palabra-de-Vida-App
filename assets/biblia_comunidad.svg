<svg width="350" height="400" viewBox="0 0 350 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente suave -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12CBC4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#12CBC4" stop-opacity="0.05"/>
    </linearGradient>
    
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12CBC4"/>
      <stop offset="100%" stop-color="#0DA69F"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="100%" height="100%" fill="url(#gradientBg)"/>
  
  <!-- Biblia principal con animación de páginas -->
  <g transform="translate(100, 50)" filter="url(#shadow)">
    <!-- Portada de la biblia -->
    <path d="M75,0 L75,200 C75,210 65,220 50,220 L0,220 L0,0 L75,0 Z" fill="url(#bookGradient)" rx="5" ry="5"/>
    
    <!-- Lomo dorado -->
    <rect x="70" y="5" width="10" height="210" fill="#FFD700" rx="2" ry="2"/>
    
    <!-- Páginas -->
    <path d="M5,5 L5,215 L65,215 L65,5 L5,5 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
    
    <!-- Página que se voltea (efecto animado) -->
    <path d="M5,50 L15,55 L15,170 L5,175 Z" fill="#F8F8F8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.6;0.8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="d" values="M5,50 L15,55 L15,170 L5,175 Z; M5,50 L20,60 L20,165 L5,175 Z; M5,50 L15,55 L15,170 L5,175 Z" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cruz en la portada -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <line x1="25" y1="100" x2="45" y2="100"/>
      <line x1="35" y1="90" x2="35" y2="110"/>
    </g>
    
    <!-- Detalles decorativos en la portada -->
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.8">
      <rect x="15" y="130" width="40" height="5" rx="1"/>
      <rect x="15" y="140" width="40" height="5" rx="1"/>
      <rect x="15" y="150" width="40" height="5" rx="1"/>
    </g>
  </g>
  
  <!-- Rayos de luz (efecto espiritual) -->
  <g stroke="#FFD700" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round">
    <line x1="175" y1="30" x2="190" y2="15">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="175" y1="20" x2="195" y2="5">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="165" y1="40" x2="180" y2="25">
      <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Texto "La Biblia Comunidad" -->
  <text x="175" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#12CBC4">
    La Biblia Comunidad
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- Texto secundario -->
  <text x="175" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666666">
    Tu aventura espiritual comienza aquí
  </text>
  
  <!-- Elementos decorativos flotantes -->
  <g fill="#12CBC4" opacity="0.6">
    <circle cx="50" cy="350" r="4">
      <animate attributeName="cy" values="350;340;350" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="340" r="3">
      <animate attributeName="cx" values="300;310;300" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="370" r="5">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>